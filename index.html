<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Giám Sát Độ pH - Nhóm 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f4f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); border-radius: 20px; border: 1px solid rgba(0,0,0,0.05); }
        .tab-btn.active { background-color: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-weight: 600; color: #18181b; }
        .tab-btn { color: #71717a; transition: all 0.2s ease; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center items-start">
    <div class="glass-panel w-full max-w-3xl p-6 md:p-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 border-b border-zinc-100 pb-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-zinc-800 flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-droplet text-xl"></i>
                </div>
                <div>
                    <span class="text-xs font-bold tracking-wider text-zinc-500 uppercase bg-zinc-100 px-2 py-1 rounded-md">Nhóm 3</span>
                    <h1 class="text-2xl font-bold text-zinc-800 mt-1">TRẠM GIÁM SÁT ĐỘ PH</h1>
                </div>
            </div>
            <div class="hidden md:flex gap-2 text-zinc-300">
                <i class="fa-solid fa-wave-square text-3xl"></i>
            </div>
        </div>

        <!-- Thông số hiện tại -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-zinc-50 p-5 rounded-xl border border-zinc-200 flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-zinc-200 flex items-center justify-center text-zinc-600"><i class="fa-solid fa-flask"></i></div>
                <div>
                    <p class="text-xs font-bold text-zinc-500 uppercase">Độ pH Hiện Tại</p>
                    <p class="text-3xl font-black text-zinc-800" id="phValue">--</p>
                </div>
            </div>
            <div class="bg-zinc-50 p-5 rounded-xl border border-zinc-200 flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-zinc-200 flex items-center justify-center text-zinc-600"><i class="fa-solid fa-bolt"></i></div>
                <div>
                    <p class="text-xs font-bold text-zinc-500 uppercase">Điện áp Vout</p>
                    <p class="text-3xl font-black text-zinc-800"><span id="voutValue">--</span><span class="text-lg text-zinc-500 font-medium">V</span></p>
                </div>
            </div>
            <div class="bg-zinc-50 p-5 rounded-xl border border-zinc-200 flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-zinc-200 flex items-center justify-center text-zinc-600"><i class="fa-solid fa-gear"></i></div>
                <div>
                    <p class="text-xs font-bold text-zinc-500 uppercase mb-1">Trạng thái Bơm</p>
                    <div class="flex items-center gap-2">
                        <span id="pumpStatusBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-zinc-200 text-zinc-600 flex items-center gap-1">
                            <span id="pumpStatusDot" class="w-2 h-2 rounded-full bg-zinc-400"></span> <span id="pumpStatusText">ĐANG TẢI</span>
                        </span>
                    </div>
                    <p id="pumpModeText" class="text-[10px] text-zinc-500 mt-1 font-medium">Chế độ: --</p>
                </div>
            </div>
        </div>

        <!-- Đồ thị -->
        <div class="border border-zinc-200 rounded-xl overflow-hidden mb-8">
            <div class="bg-zinc-100 p-3 px-4 flex justify-between items-center border-b border-zinc-200">
                <h3 class="font-bold text-zinc-700 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-chart-line"></i> <span id="chartTitle">ĐỒ THỊ ĐỘ PH (THỰC TẾ)</span>
                </h3>
                <div class="flex bg-zinc-200/50 p-1 rounded-lg text-xs" id="timeTabs">
                    <button class="tab-btn active px-3 py-1.5 rounded-md" data-points="20">Live</button>
                    <button class="tab-btn px-3 py-1.5 rounded-md" data-points="60">Rộng hơn</button>
                </div>
            </div>
            <div class="p-4 bg-white">
                <canvas id="phChart" height="100"></canvas>
            </div>
        </div>

        <!-- Cài đặt ngưỡng & Điều khiển -->
        <div class="border border-zinc-200 rounded-xl overflow-hidden mb-8">
            <div class="bg-zinc-100 p-3 px-4 border-b border-zinc-200">
                <h3 class="font-bold text-zinc-700 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> CÀI ĐẶT NGƯỠNG BƠM TỰ ĐỘNG
                </h3>
            </div>
            <div class="p-5 bg-white">
                <div class="flex flex-col md:flex-row gap-6 items-center justify-center mb-6">
                    <div class="flex items-center gap-3">
                        <label class="text-sm font-semibold text-zinc-600">Bật bơm khi pH <</label>
                        <input type="number" id="inputLow" value="5.5" step="0.1" class="w-20 px-3 py-1.5 border border-zinc-300 rounded-lg text-center font-bold text-zinc-800 focus:outline-none focus:border-zinc-500">
                    </div>
                    <div class="hidden md:block w-px h-8 bg-zinc-200"></div>
                    <div class="flex items-center gap-3">
                        <label class="text-sm font-semibold text-zinc-600">Tắt bơm khi pH ≥</label>
                        <input type="number" id="inputHigh" value="6.2" step="0.1" class="w-20 px-3 py-1.5 border border-zinc-300 rounded-lg text-center font-bold text-zinc-800 focus:outline-none focus:border-zinc-500">
                    </div>
                </div>
                <div class="flex flex-wrap justify-center gap-3">
                    <button id="btnSaveThreshold" class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 text-white text-sm font-bold rounded-lg transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Lưu ngưỡng cài đặt
                    </button>
                    <button id="btnTogglePump" class="px-5 py-2 bg-zinc-200 hover:bg-zinc-300 text-zinc-800 text-sm font-bold rounded-lg transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-power-off"></i> Bật/Tắt bơm thủ công
                    </button>
                    <button id="btnToggleAuto" class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 text-white text-sm font-bold rounded-lg transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-robot"></i> Đổi chế độ Tự động
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center pt-4 border-t border-zinc-100 flex flex-col items-center gap-2">
            <div class="flex items-center gap-2 text-xs font-semibold text-zinc-500">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-zinc-300 animate-pulse"></span>
                <span id="statusText">Đang chờ kết nối máy chủ Firebase...</span>
            </div>
            <p class="text-[11px] text-zinc-400 font-medium tracking-wide uppercase">Nhóm 3: Phạm Mạnh Cường - Nguyễn Thái Bảo - Nguyễn Tấn Đạt</p>
        </div>
    </div>

    <!-- Firebase & Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Cấu hình Firebase đọc từ ảnh chụp của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyDLmwTFCHjkX54_SS5AqEp7lxNePiG21jI",
            authDomain: "do-an-ph-nhom-3.firebaseapp.com",
            databaseURL: "https://do-an-ph-nhom-3-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "do-an-ph-nhom-3",
            storageBucket: "do-an-ph-nhom-3.firebasestorage.app",
            messagingSenderId: "630006807120",
            appId: "1:630006807120:web:28e1ecc13e789125a3ef55"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Các biến toàn cục lưu trạng thái
        let currentAutoMode = true;
        let currentPumpState = false;

        // Cấu hình Đồ thị Chart.js
        const ctx = document.getElementById('phChart').getContext('2d');
        let maxDataPoints = 20;
        
        const phChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Độ pH',
                    data: [],
                    borderColor: '#27272a', // zinc-800
                    backgroundColor: 'rgba(39, 39, 42, 0.05)',
                    borderWidth: 2,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#27272a',
                    pointBorderWidth: 2,
                    pointRadius: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { min: 0, max: 14, ticks: { stepSize: 3.5, color: '#a1a1aa', font: { size: 10 } }, grid: { color: '#f4f4f5' }, border: { display: false } },
                    x: { ticks: { color: '#a1a1aa', font: { size: 10 }, maxTicksLimit: 6 }, grid: { display: false }, border: { display: false } }
                },
                plugins: { legend: { display: false }, tooltip: { backgroundColor: '#27272a', padding: 10, cornerRadius: 8, displayColors: false } },
                animation: { duration: 300 }
            }
        });

        // Xử lý Tabs thời gian đồ thị
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                maxDataPoints = parseInt(e.target.dataset.points);
            });
        });

        // Lắng nghe trạng thái kết nối
        const connectedRef = ref(db, ".info/connected");
        onValue(connectedRef, (snap) => {
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            if (snap.val() === true) {
                statusText.textContent = "Đã kết nối Firebase (Chờ dữ liệu từ mạch ESP32)...";
                statusDot.classList.replace('bg-zinc-300', 'bg-green-500');
            } else {
                statusText.textContent = "Mất kết nối với máy chủ Firebase!";
                statusDot.classList.replace('bg-green-500', 'bg-red-500');
                statusDot.classList.replace('bg-zinc-300', 'bg-red-500');
            }
        });

        // Lắng nghe dữ liệu cảm biến pH và Vout
        onValue(ref(db, 'Sensor/pH'), (snapshot) => {
            const val = snapshot.val();
            if(val !== null) {
                document.getElementById('phValue').textContent = parseFloat(val).toFixed(2);
                
                // Cập nhật đồ thị
                const now = new Date();
                const timeString = now.getHours().toString().padStart(2,'0') + ':' + 
                                 now.getMinutes().toString().padStart(2,'0') + ':' + 
                                 now.getSeconds().toString().padStart(2,'0');
                
                phChart.data.labels.push(timeString);
                phChart.data.datasets[0].data.push(val);
                
                if (phChart.data.labels.length > maxDataPoints) {
                    phChart.data.labels.shift();
                    phChart.data.datasets[0].data.shift();
                }
                phChart.update();
            }
        });

        onValue(ref(db, 'Sensor/Vout'), (snapshot) => {
            const val = snapshot.val();
            if(val !== null) document.getElementById('voutValue').textContent = parseFloat(val).toFixed(3);
        });

        // Lắng nghe trạng thái Bơm và Chế độ
        const badge = document.getElementById('pumpStatusBadge');
        const badgeDot = document.getElementById('pumpStatusDot');
        const badgeText = document.getElementById('pumpStatusText');

        onValue(ref(db, 'Control/PumpState'), (snapshot) => {
            const state = snapshot.val();
            if(state !== null) {
                currentPumpState = state;
                if(state) {
                    badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-zinc-800 text-white flex items-center gap-1";
                    badgeDot.className = "w-2 h-2 rounded-full bg-green-400";
                    badgeText.textContent = "ĐANG BƠM";
                } else {
                    badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-zinc-200 text-zinc-600 flex items-center gap-1";
                    badgeDot.className = "w-2 h-2 rounded-full bg-zinc-400";
                    badgeText.textContent = "ĐANG TẮT";
                }
            }
        });

        onValue(ref(db, 'Control/AutoMode'), (snapshot) => {
            const isAuto = snapshot.val();
            if(isAuto !== null) {
                currentAutoMode = isAuto;
                document.getElementById('pumpModeText').textContent = isAuto ? "Chế độ: Tự động" : "Chế độ: Thủ công";
                const btnAuto = document.getElementById('btnToggleAuto');
                if(isAuto) {
                    btnAuto.innerHTML = '<i class="fa-solid fa-robot"></i> Đang bật Tự động';
                    btnAuto.className = "px-5 py-2 bg-zinc-800 hover:bg-zinc-700 text-white text-sm font-bold rounded-lg transition-colors flex items-center gap-2";
                } else {
                    btnAuto.innerHTML = '<i class="fa-solid fa-hand"></i> Đang bật Thủ công';
                    btnAuto.className = "px-5 py-2 bg-zinc-200 hover:bg-zinc-300 text-zinc-800 text-sm font-bold rounded-lg transition-colors flex items-center gap-2";
                }
            }
        });

        // Lắng nghe Ngưỡng cài đặt từ Database (để đồng bộ nhiều thiết bị)
        onValue(ref(db, 'Settings/ThresholdLow'), (snapshot) => {
            if(snapshot.val() !== null) document.getElementById('inputLow').value = snapshot.val();
        });
        onValue(ref(db, 'Settings/ThresholdHigh'), (snapshot) => {
            if(snapshot.val() !== null) document.getElementById('inputHigh').value = snapshot.val();
        });

        // Các nút điều khiển ghi dữ liệu lên Firebase
        document.getElementById('btnToggleAuto').addEventListener('click', () => {
            set(ref(db, 'Control/AutoMode'), !currentAutoMode);
        });

        document.getElementById('btnTogglePump').addEventListener('click', () => {
            if(currentAutoMode) {
                alert("Vui lòng chuyển sang chế độ THỦ CÔNG trước khi bật/tắt bơm!");
                return;
            }
            set(ref(db, 'Control/PumpState'), !currentPumpState);
        });

        document.getElementById('btnSaveThreshold').addEventListener('click', () => {
            const low = parseFloat(document.getElementById('inputLow').value);
            const high = parseFloat(document.getElementById('inputHigh').value);
            if(low >= high) {
                alert("Ngưỡng bật bơm phải NHỎ HƠN ngưỡng tắt bơm!");
                return;
            }
            set(ref(db, 'Settings/ThresholdLow'), low);
            set(ref(db, 'Settings/ThresholdHigh'), high);
            
            // Đổi màu nút tạm thời để báo hiệu đã lưu
            const btn = document.getElementById('btnSaveThreshold');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Đã lưu!';
            btn.classList.replace('bg-zinc-800', 'bg-green-600');
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-green-600', 'bg-zinc-800');
            }, 2000);
        });
    </script>
</body>
</html>
